services:
  gateway:
    environment:
      EAAF_OPENAI_ENABLED: "true"

  litellm:
    command: ["--config", /app/eaaf-openai.yaml, "--host", 0.0.0.0, "--port", "4000"]
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env to enable OpenAI}"
    volumes:
      - ./config/litellm.openai.yaml:/app/eaaf-openai.yaml:ro
      - ./config/litellm.openai-models.yaml:/app/eaaf-openai-models.yaml:ro
    networks: [backend, provider-egress]

networks:
  provider-egress:
