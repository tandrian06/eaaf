model_list:
  - model_name: eaaf-mock
    litellm_params: &mock_deployment
      model: openai/eaaf-mock-backend
      api_base: os.environ/MOCK_API_BASE
      api_key: sk-eaaf-local-placeholder
      timeout: 10
  - model_name: eaaf-mock-extended
    litellm_params: *mock_deployment
router_settings:
  num_retries: 0
general_settings:
  master_key: sk-eaaf-local-proxy
litellm_settings:
  turn_off_message_logging: true
